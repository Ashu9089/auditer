function today(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function checkPassword(){

function fmtDate(v){
  if(!v) return "";
  return new Date(v).toLocaleString("en-IN");
}
function pct(ok,total){
  return total>0 ? ((ok/total)*100).toFixed(1)+"%" : "0.0%";
}
function shortParam(t){
  return String(t).replace(" documented","").replace(" available","").replace(" mentioned","").replace(" completed","").slice(0,28);
}

async function loadReport(){
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  if(!from || !to){ alert("Date range select karo"); return; }

  const start = from + "T00:00:00";
  const end = to + "T23:59:59";

  const {data, error} = await sb.from("med_audits")
    .select("*")
    .gte("created_at", start)
    .lte("created_at", end)
    .order("created_at", {ascending:true});
  if(error){ alert(error.message); console.error(error); return; }
  audits = data || [];

  if(audits.length === 0){
    auditItems = []; summaryRows = [];
    render();
    alert("No data found");
    return;
  }

  const ids = audits.map(a=>a.id);
  const {data: itemData, error:itemError} = await sb.from("med_audit_items")
    .select("*")
    .in("audit_id", ids);
  if(itemError){ alert(itemError.message); console.error(itemError); return; }
  auditItems = itemData || [];
  buildSummary();
  render();
}

function itemMapForAudit(auditId){
  const m = {};
  auditItems.filter(x=>x.audit_id===auditId).forEach(x=>m[x.item_id]=x);
  return m;
}

function buildSummary(){
  summaryRows = baseItems.map(p=>{
    let total=0, yes=0, no=0, na=0;
    audits.forEach(a=>{
      const im = itemMapForAudit(a.id);
      const it = im[p.id];
      if(!it) return;
      if(it.status==="na"){ na++; return; }
      total++;
      if(it.status==="yes") yes++;
      if(it.status==="no") no++;
    });
    const incomplete = no;
    return {id:p.id, parameter:p.text, total, compliant:yes, incomplete, na, percentage:pct(yes,total)};
  });
}

function render(){
  const totalAudits = audits.length;
  const totalParams = summaryRows.reduce((s,r)=>s+r.total,0);
  const totalCompliant = summaryRows.reduce((s,r)=>s+r.compliant,0);
  const totalIncomplete = summaryRows.reduce((s,r)=>s+r.incomplete,0);
  const overall = pct(totalCompliant,totalParams);
  document.getElementById("kpiBox").innerHTML = `
    <div>Total Audit: ${totalAudits}</div>
    <div>Total Parameters Audited: ${totalParams}</div>
    <div>Total Compliance: ${totalCompliant}</div>
    <div>Total Non Compliance: ${totalIncomplete}</div>
    <div>Overall Percentage: ${overall}</div>
  `;

  document.getElementById("summaryTable").innerHTML = `
    <tr><th>Parameter</th><th>Total</th><th>Compliance</th><th>Non Compliance</th><th>NA</th><th>Percentage</th></tr>
    ${summaryRows.map(r=>`<tr><td class="left">${r.id}. ${r.parameter}</td><td>${r.total}</td><td>${r.compliant}</td><td>${r.incomplete}</td><td>${r.na}</td><td>${r.percentage}</td></tr>`).join("")}
    <tr><th>Total</th><th>${totalParams}</th><th>${totalCompliant}</th><th>${totalIncomplete}</th><th>${summaryRows.reduce((s,r)=>s+r.na,0)}</th><th>${overall}</th></tr>
  `;

  document.getElementById("auditTable").innerHTML = `
    <tr><th>S.N</th><th>Audit Date Time</th><th>IP</th><th>UHID</th><th>Patient</th><th>Score</th><th>Compliance %</th></tr>
    ${audits.map((a,i)=>`<tr><td>${i+1}</td><td>${fmtDate(a.created_at)}</td><td>${a.ip_number||""}</td><td>${a.uhid||""}</td><td>${a.patient_name||""}</td><td>${a.yes_count||0}/${a.applicable_count||0}</td><td>${a.compliance_percent||0}%</td></tr>`).join("")}
  `;
}

function downloadExcel(){
  if(!checkPassword()) return;
  if(!audits.length){ alert("Pehle data show karo"); return; }

  const rows = audits.map((a,i)=>{
    const im = itemMapForAudit(a.id);
    const row = {
      "S.N": i+1,
      "Audit Date Time": fmtDate(a.created_at),
      "IP Number": a.ip_number || "",
      "UHID": a.uhid || "",
      "Patient Name": a.patient_name || "",
      "Age": a.age || "",
      "Gender": a.gender || "",
      "Ward": a.ward || "",
      "Bed": a.bed_number || "",
      "Compliance %": (a.compliance_percent || 0) + "%",
      "Overall Remark": a.global_remark || ""
    };
    baseItems.forEach(p=>{
      const it = im[p.id];
      row[p.id+" "+p.text] = it ? it.status.toUpperCase() : "";
      row[p.id+" Remark"] = it ? (it.remark || "") : "";
    });
    return row;
  });

  const summary = summaryRows.map(r=>({
    Parameter:r.parameter,
    Total:r.total,
    Compliance:r.compliant,
    "Non Compliance":r.incomplete,
    NA:r.na,
    Percentage:r.percentage
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Audit Data");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "Parameter Summary");
  XLSX.writeFile(wb, "MedAudit_Report_Original_Parameters.xlsx");
}

  /*
    Monthly PDF ab 25-25 parameters me split hoga:
    Page 1  = Summary
    Page 2  = Parameter 01-25
    Page 3  = Parameter 26-50
    Page 4  = Parameter 51-75
    Page 5  = Parameter 76-100
    Page 6+ = Death parameters agar selected data me ho
  */

  const doc = new jsPDF("l","pt","a4");

  function addHeader(title, y=20){
    doc.setFont("helvetica","bold");
    doc.setFontSize(11);
    doc.text("ARC PLUS SUPER SPECIALTY HOSPITAL, CHITAIPUR VARANASI", 421, y, {align:"center"});

  // ---------- PAGE 1: SUMMARY ----------
  addHeader("MEDICAL RECORD REVIEW AUDIT SHEET - SUMMARY");

  const totalParams = summaryRows.reduce((s,r)=>s+r.total,0);
  const totalCompliant = summaryRows.reduce((s,r)=>s+r.compliant,0);

  const totalNA = summaryRows.reduce((s,r)=>s+r.na,0);
  const overall = pct(totalCompliant,totalParams);

  doc.autoTable({
    startY: 58,
    head: [["PARAMETER","TOTAL","COMPLIANCE","NON COMPLIANCE","NA","PERCENTAGE"]],
    body: summaryRows.map(r=>[r.id+". "+r.parameter, r.total, r.compliant, r.incomplete, r.na, r.percentage]),
    styles:{fontSize:6.5,cellPadding:3,halign:"center",valign:"middle",lineColor:[0,0,0],lineWidth:.35},
    headStyles:{fillColor:[255,255,255],textColor:[0,0,0],fontStyle:"bold",lineColor:[0,0,0],lineWidth:.8},
    columnStyles:{0:{cellWidth:360,halign:"left"},1:{cellWidth:70},2:{cellWidth:80},3:{cellWidth:95},4:{cellWidth:55},5:{cellWidth:80}},
    margin:{left:30,right:30}
  });

  let sy = doc.lastAutoTable.finalY + 14;
  if(sy > 520){
    doc.addPage();
    addHeader("MEDICAL RECORD REVIEW AUDIT SHEET - TOTAL SUMMARY");
    sy = 70;
  }
  doc.setFont("helvetica","bold");
  doc.setFontSize(10);
  doc.text(`Total Audit: ${audits.length}`, 35, sy);
  doc.text(`Total Parameters Audited: ${totalParams}`, 35, sy+15);

  doc.text(`Total NA: ${totalNA}`, 35, sy+60);
  doc.text(`Overall Percentage: ${overall}`, 35, sy+75);

  // ---------- PARAMETER SHEET PAGES: 25-25 ----------
  const chunks = [];
  for(let i=0; i<baseItems.length; i+=25){
    chunks.push(baseItems.slice(i, i+25));
  }

  chunks.forEach((params, chunkIndex)=>{
    doc.addPage();
    const startNo = chunkIndex*25 + 1;
    const endNo = startNo + params.length - 1;
    addHeader(`MEDICAL RECORD REVIEW AUDIT SHEET - PARAMETERS ${String(startNo).padStart(2,"0")} TO ${String(endNo).padStart(2,"0")}`);

    const head = [["S.N","IPD NO","UHID","PATIENT",...params.map(p=>p.id), "SCORE"]];
    const body = audits.map((a,i)=>{
      const im = itemMapForAudit(a.id);
      let yes=0, applicable=0;
      const vals = params.map(p=>{
        const st = im[p.id]?.status || "";
        if(st && st !== "na") applicable++;
        if(st === "yes") yes++;
        if(st === "yes") return "✓";
        if(st === "no") return "X";
        if(st === "na") return "NA";
        return "";
      });
      return [
        i+1,
        a.ip_number || "",
        a.uhid || "",
        (a.patient_name || "").slice(0,16),
        ...vals,
        `${yes}/${applicable}`
      ];
    });

    const scoreRow = ["SCORE","","","",...params.map(p=>{
      const r = summaryRows.find(x=>x.id===p.id);
      return `${r?.compliant||0}/${r?.total||0}`;
    }), ""];

    doc.autoTable({
      startY: 58,
      head,
      body: [...body, scoreRow],
      styles:{
        fontSize:6,
        cellPadding:2,
        halign:"center",
        valign:"middle",
        lineColor:[0,0,0],
        lineWidth:.6,
        minCellHeight:17
      },
      headStyles:{
        fillColor:[255,255,255],
        textColor:[0,0,0],
        fontStyle:"bold",
        lineColor:[0,0,0],
        lineWidth:.8,
        minCellHeight:70
      },
      margin:{left:12,right:12},
      columnStyles:{
        0:{cellWidth:22},
        1:{cellWidth:48},
        2:{cellWidth:55},
        3:{cellWidth:85},
        [params.length+4]:{cellWidth:42}
      },
      didParseCell:function(data){
        if(data.column.index >= 4 && data.column.index <= params.length+3){
          data.cell.styles.cellWidth = 22;
        }
        if(data.section === "head" && data.column.index >= 4 && data.column.index <= params.length+3){
          const p = params[data.column.index-4];
          data.cell.text = [p.id, shortParam(p.text)];
          data.cell.styles.fontSize = 4.5;
          data.cell.styles.valign = "middle";
        }
        if(data.section === "body" && data.row.index === body.length){
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [245,248,250];
        }
      }
    });

    let y = doc.lastAutoTable.finalY + 10;
    if(y < 520){
      doc.setFont("helvetica","bold");
      doc.setFontSize(6);
      doc.text("Parameter Details:", 14, y);
      doc.setFont("helvetica","normal");
      params.forEach((p,idx)=>{
        const lineY = y + 10 + (idx%13)*8;
        const lineX = idx < 13 ? 14 : 410;
        doc.text(`${p.id}: ${p.text}`, lineX, lineY);
      });
    }
    doc.setFontSize(5);
    doc.text("Generated: " + new Date().toLocaleString("en-IN"), 14, 580);
  });

  // ---------- DEATH PARAMETERS PAGE IF AVAILABLE ----------
  const deathParams = baseItems.filter(p=>String(p.id).startsWith("DTH"));
  const hasDeathData = deathParams.some(p => summaryRows.find(r=>r.id===p.id && (r.total>0 || r.na>0)));
  if(hasDeathData){
    doc.addPage();
    addHeader("MEDICAL RECORD REVIEW AUDIT SHEET - DEATH PARAMETERS");

    const params = deathParams;
    const head = [["S.N","IPD NO","UHID","PATIENT",...params.map(p=>p.id), "SCORE"]];
    const body = audits.map((a,i)=>{
      const im = itemMapForAudit(a.id);
      let yes=0, applicable=0;
      const vals = params.map(p=>{
        const st = im[p.id]?.status || "";
        if(st && st !== "na") applicable++;
        if(st === "yes") yes++;
        if(st === "yes") return "✓";
        if(st === "no") return "X";
        if(st === "na") return "NA";
        return "";
      });
      return [i+1, a.ip_number||"", a.uhid||"", (a.patient_name||"").slice(0,18), ...vals, `${yes}/${applicable}`];
    });
    const scoreRow = ["SCORE","","","",...params.map(p=>{
      const r = summaryRows.find(x=>x.id===p.id);
      return `${r?.compliant||0}/${r?.total||0}`;
    }), ""];

    doc.autoTable({
      startY:58,
      head,
      body:[...body, scoreRow],
      styles:{fontSize:7,cellPadding:3,halign:"center",valign:"middle",lineColor:[0,0,0],lineWidth:.6},
      headStyles:{fillColor:[255,255,255],textColor:[0,0,0],fontStyle:"bold",lineColor:[0,0,0],lineWidth:.8},
      margin:{left:20,right:20},
      columnStyles:{0:{cellWidth:28},1:{cellWidth:55},2:{cellWidth:65},3:{cellWidth:110}},
      didParseCell:function(data){
        if(data.section === "body" && data.row.index === body.length){
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [245,248,250];
        }
      }
    });
  }

  doc.save("Monthly_Audit_Sheet_25_Parameters_Per_Page.pdf");
}
function downloadDetailPdf(){
  if(!checkPassword()) return;
  if(!audits.length){ alert("Pehle data show karo"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p","pt","a4");
  audits.forEach((a,idx)=>{
    if(idx>0 && idx%4===0) doc.addPage();
    const boxY = 30 + (idx%4)*190;
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text(`File ${idx+1}: ${a.patient_name||""} | IP: ${a.ip_number||""} | UHID: ${a.uhid||""}`, 25, boxY);
    doc.setFont("helvetica","normal"); doc.setFontSize(7);
    doc.text(`Audit: ${fmtDate(a.created_at)} | Score: ${a.yes_count||0}/${a.applicable_count||0} | Compliance: ${a.compliance_percent||0}%`, 25, boxY+12);
    const im = itemMapForAudit(a.id);
    const body = baseItems.map(p=>[p.id, p.text, (im[p.id]?.status||"").toUpperCase(), im[p.id]?.remark||""]);
    doc.autoTable({
      startY: boxY+20,
      head:[["ID","Parameter","Status","Remark"]],
      body,
      styles:{fontSize:4.8,cellPadding:1,lineWidth:.1},
      headStyles:{fillColor:[11,59,95],fontSize:5},
      margin:{left:25,right:25},
      tableWidth:545,
      columnStyles:{0:{cellWidth:24},1:{cellWidth:280},2:{cellWidth:45},3:{cellWidth:190}},
      pageBreak:"avoid"
    });
  });
  doc.save("Detail_Audit_Report_4_File_Per_Page.pdf");
}
